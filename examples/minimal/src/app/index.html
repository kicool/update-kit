<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>update-kit minimal example</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 8px 16px; margin: 4px; }
    #status { margin-top: 16px; padding: 12px; background: #f0f0f0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>update-kit minimal example</h1>
  <p>这是一个最小接入示例，展示如何使用 update-kit。</p>

  <div>
    <button onclick="api.checkUpdate()">检查更新</button>
    <button onclick="api.applyUpdate()">应用更新</button>
    <button onclick="api.relaunch()">重启</button>
  </div>

  <div id="status">状态：等待操作...</div>

  <script src="renderer.js"></script>
</body>
</html>
